<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #b8c9bb;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Quiz Result</h1>
        <p class="text-center">Your Score: {{ score }}</p>

        <div class="text-center mt-4">
            <a href="{{ url_for('quiz') }}" class="btn btn-primary">Retake Quiz</a>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Go Back</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
